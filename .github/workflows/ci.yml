name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest   # the wizard is net10.0-windows + WPF, which needs Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore SmartMailboxCopy.slnx

      - name: Build
        run: dotnet build SmartMailboxCopy.slnx --no-restore -c Release
